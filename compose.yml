# Canonical development Compose setup for Velocious.
#
# One ordinary `dev` service with a complete development-home bind and one
# authorized read-only GitHub CLI configuration bind. The development home
# (DEV_HOME_PATH) already contains this repository's checkout at
# $DEV_HOME_PATH/velocious plus any sibling checkouts, installed
# dependencies, caches, and tool state. Nothing else is mounted.
#
# Concurrent isolated instances use standard Compose project naming plus a
# distinct DEV_HOME_PATH per instance, e.g.:
#
#   COMPOSE_PROJECT_NAME=velocious-review DEV_HOME_PATH=/srv/dev-homes/review \
#     docker compose up --build --detach
name: velocious

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU24-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Super-Secret-Password}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 120s
    ports:
      - "1433:1433"

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "1000:1000"
    working_dir: /home/dev/velocious
    environment:
      GH_CONFIG_DIR: /home/dev/.config/gh
      HOME: /home/dev
      NODE_ENV: development
    volumes:
      # One configurable development home: the Velocious checkout at
      # $DEV_HOME_PATH/velocious plus any sibling repositories, caches,
      # settings, and node_modules all persist naturally under /home/dev.
      - ${DEV_HOME_PATH:-/home/dev}:/home/dev
      - ${GH_CONFIG_SOURCE_PATH:?Set GH_CONFIG_SOURCE_PATH in .env}:/home/dev/.config/gh:ro
    command: ["sleep", "infinity"]
