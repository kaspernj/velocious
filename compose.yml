# Canonical development Compose setup for Velocious.
#
# One ordinary `dev` service with a complete development-home bind, a shared
# writable provider runtime, one exact read-only agent-context bundle, and one
# authorized read-only GitHub CLI configuration bind. The development home
# (DEV_HOME_PATH) already contains this repository's checkout at
# $DEV_HOME_PATH/velocious plus any sibling checkouts, installed dependencies,
# lane-local caches, and tool state.
#
# Concurrent isolated instances use standard Compose project naming plus a
# distinct DEV_HOME_PATH per instance, e.g.:
#
#   COMPOSE_PROJECT_NAME=velocious-review DEV_HOME_PATH=/srv/dev-homes/review \
#     docker compose up --build --detach
name: velocious

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "1000:1000"
    working_dir: /home/dev/velocious
    environment:
      GH_CONFIG_DIR: /home/dev/.config/gh
      HOME: /home/dev
      KIMI_CODE_HOME: /home/dev/.kimi-code
      NODE_ENV: development
      THREADWIRE_CODEX_BIN: /usr/local/bin/codex
      THREADWIRE_KIMI_BIN: /usr/local/bin/kimi
      THREADWIRE_OPENCODE_BIN: /usr/local/bin/opencode
    volumes:
      # One configurable development home: the Velocious checkout at
      # $DEV_HOME_PATH/velocious plus any sibling repositories, caches,
      # settings, and node_modules all persist naturally under /home/dev.
      - type: bind
        source: ${DEV_HOME_PATH:-/home/dev}
        target: /home/dev
        bind:
          create_host_path: false
      - type: bind
        source: ${AI_PROVIDER_RUNTIME_SOURCE_PATH:?Set AI_PROVIDER_RUNTIME_SOURCE_PATH in .env}
        target: /opt/hermes-dind-shared/auth/provider-runtime
        bind:
          create_host_path: false
      - type: bind
        source: ${AGENT_CONTEXT_SOURCE_PATH:?Set AGENT_CONTEXT_SOURCE_PATH in .env}
        target: /opt/hermes-agent-context
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GH_CONFIG_SOURCE_PATH:?Set GH_CONFIG_SOURCE_PATH in .env}
        target: /home/dev/.config/gh
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["/home/dev/velocious/scripts/bootstrap-provider-runtime.sh", "/home/dev", "/opt/hermes-dind-shared/auth/provider-runtime", "/opt/hermes-agent-context"]
    command: ["sleep", "infinity"]
